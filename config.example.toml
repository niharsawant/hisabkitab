# Copy this file to config.toml, then replace these fictional examples with your own rules.
# Rules are checked in order; the first matching keyword determines the category.

[[rules]]
keys = ["sample cafe", "demo restaurant"]
category = "Food"

[[rules]]
keys = ["example power company"]
category = "Bills"

# Family and personal account statements currently support ICICI.
# Personal credit cards support ICICI or HSBC. HSBC statements are CSV files.
[statements]
family_account_bank = "ICICI"
personal_account_bank = "ICICI"
personal_credit_account_bank = "ICICI"
# For an HSBC credit card CSV, change the value above to "HSBC".

[google_sheets]
personal_and_credit_url = "https://docs.google.com/spreadsheets/d/REPLACE_WITH_PERSONAL_SHEET_ID/edit?gid=0"
family_url = "https://docs.google.com/spreadsheets/d/REPLACE_WITH_FAMILY_SHEET_ID/edit?gid=0"
duplicate_window = 10
service_account_file = "service-account.json"
